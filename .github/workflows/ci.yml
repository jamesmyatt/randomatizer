name: CI

# PRs get one run (against the merge with main); main builds after each merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run at a time per branch/PR. A newer commit replaces any run still queued;
# the run already in progress finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      # assembleDebug also runs verifyDebugPermissions, which fails on INTERNET.
      # -Proborazzi.test.record=true writes the screenshot tests' PNGs.
      - run: ./gradlew spotlessCheck assembleDebug testDebugUnitTest lintDebug -Proborazzi.test.record=true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: randomatizer-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: randomatizer-screenshots-${{ github.event.pull_request.head.sha || github.sha }}
          path: app/build/outputs/roborazzi/*.png
          retention-days: 14
          if-no-files-found: error
