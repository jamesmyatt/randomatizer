name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check tag matches app version
        id: version
        run: |
          major=$(sed -n 's/^appVersionMajor=//p' gradle.properties)
          patch=$(sed -n 's/^appVersionPatch=//p' gradle.properties)
          version="$major.$patch"
          code=$((major * 1000 + patch))
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version in gradle.properties (expected v$version)"
            exit 1
          fi
          changelog="fastlane/metadata/android/en-US/changelogs/$code.txt"
          if [ ! -f "$changelog" ]; then
            echo "::error::Missing changelog $changelog"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "changelog=$changelog" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set. See RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RANDOMATIZER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # assembleRelease also runs verifyReleasePermissions, which fails on INTERNET.
      - name: Build, test and lint
        env:
          RANDOMATIZER_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RANDOMATIZER_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RANDOMATIZER_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Verify signature and rename APK
        id: apk
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          src=app/build/outputs/apk/release/app-release.apk
          "$apksigner" verify --print-certs "$src"
          apk="randomatizer-${{ steps.version.outputs.version }}.apk"
          mv "$src" "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.apk.outputs.apk }}" "${{ steps.apk.outputs.apk }}.sha256" \
            --title "Randomatizer ${{ steps.version.outputs.version }}" \
            --notes-file "${{ steps.version.outputs.changelog }}" \
            --verify-tag

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
