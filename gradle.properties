org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# App version: versionName = MAJOR.MINOR.PATCH, versionCode = MAJOR * 10000 + MINOR * 100 + PATCH.
# Most code changes bump MAJOR (and reset MINOR and PATCH to 0). See CLAUDE.md.
appVersionMajor=1
appVersionMinor=0
appVersionPatch=0
